<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#22d3ee" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect x="20" y="20" width="360" height="360" rx="60" ry="60" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="3" filter="url(#shadow)"/>
  <!-- Code bracket { opening -->
  <path d="M 115 120 Q 90 120 90 145 L 90 175 Q 90 195 75 200 Q 90 205 90 225 L 90 255 Q 90 280 115 280" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Code bracket } closing -->
  <path d="M 285 120 Q 310 120 310 145 L 310 175 Q 310 195 325 200 Q 310 205 310 225 L 310 255 Q 310 280 285 280" fill="none" stroke="url(#accentGrad2)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Slash in middle -->
  <line x1="195" y1="130" x2="205" y2="270" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)" opacity="0.8"/>
  <!-- Small decorative dots -->
  <circle cx="200" cy="110" r="4" fill="#22d3ee" opacity="0.6"/>
  <circle cx="200" cy="290" r="4" fill="#6366f1" opacity="0.6"/>
  <circle cx="110" cy="200" r="3" fill="#22d3ee" opacity="0.4"/>
  <circle cx="290" cy="200" r="3" fill="#a855f7" opacity="0.4"/>
</svg>
